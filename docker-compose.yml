services:
  postgres:
    image: postgres:17
    container_name: badukstone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: badukstone
    ports:
      - "5432:5432"
    volumes:
      - badukstone_pgdata:/var/lib/postgresql/data

volumes:
  badukstone_pgdata:
