name: Deploy Railway

# CI가 main에서 성공한 뒤(또는 수동 실행 시) GitHub 소스를 유지한 채 최신 커밋을 배포합니다.
# railway up 업로드는 Git 자동배포를 끊을 수 있어 사용하지 않습니다.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-railway-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Require Railway token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::GitHub Actions secret RAILWAY_TOKEN 이 없습니다."
            echo "Railway → Project Settings → Tokens 에서 Project Token을 만들고"
            echo "GitHub 저장소 → Settings → Secrets and variables → Actions 에"
            echo "이름 RAILWAY_TOKEN 으로 추가하세요."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.2.0

      - name: Connect GitHub source (frontend)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          railway service source connect \
            --repo BlueStarAcademy/badukstone2026 \
            --branch main \
            --service badukstone2026 \
            --json || echo "::warning::프론트 GitHub 소스 연결을 건너뜁니다 (이미 연결됐거나 토큰 권한 부족)."

      - name: Connect GitHub source (API)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          railway service source connect \
            --repo BlueStarAcademy/badukstone2026 \
            --branch main \
            --service badukstone-api \
            --json || echo "::warning::API GitHub 소스 연결을 건너뜁니다 (이미 연결됐거나 토큰 권한 부족)."

      - name: Deploy latest main (frontend)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway redeploy --service badukstone2026 --yes --from-source --json

      - name: Deploy latest main (API)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway redeploy --service badukstone-api --yes --from-source --json
